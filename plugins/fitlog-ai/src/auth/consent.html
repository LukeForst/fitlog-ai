<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授权 FitLog</title>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17342a;background:#f5f4ee}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(440px,100%);background:#fff;border:1px solid #dde4dc;border-radius:18px;padding:24px;box-shadow:0 14px 40px #17342a12}h1{font-size:23px;margin:0 0 8px}p{line-height:1.55;color:#56665f}label{display:block;font-size:14px;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bec9c0;border-radius:10px;font:inherit}button{font:inherit;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #4d9b7b;outline-offset:2px}.primary{background:#176b4a;color:#fff}.secondary{background:#e9efea;color:#17342a;margin-left:8px}.actions{margin-top:18px}.hidden{display:none}.error{color:#b42318}.detail{background:#f7f9f7;border-radius:10px;padding:12px;margin-top:16px;font-size:14px}.detail ul{padding-left:20px;margin:8px 0 0}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>连接 FitLog</h1>
      <p id="message">正在准备授权信息…</p>
      <form id="email-form" class="hidden">
        <label for="email">你的登录邮箱</label>
        <input id="email" type="email" autocomplete="email" required />
        <div class="actions"><button class="primary" type="submit">发送登录链接</button></div>
      </form>
      <section id="approval" class="hidden"><div id="request-detail" class="detail"></div><div class="actions"><button id="approve" class="primary">允许连接</button><button id="deny" class="secondary">拒绝</button></div></section>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script type="module" src="./consent.ts"></script>
  </body>
</html>
